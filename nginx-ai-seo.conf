# ai-seo: serve markdown mirrors as text/plain so LLM crawlers don't trigger download prompts.
# Drop this snippet inside the relevant `server { ... }` block in your nginx config.

location ~* \.md$ {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff;
}

# Optional: same for llms.txt
location = /llms.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
}
